# Pulls the Laravel backend's own compose file into this project so both
# stacks run as one Compose project, sharing one default network — no manual
# `docker network create` or `external: true` needed. Services become
# addressable by their service name (e.g. http://web:80 for Laravel's nginx),
# same as if they'd always been defined in one file.
#
# Update the path below to wherever the Laravel project's docker-compose.yml
# actually lives relative to this file (or use an absolute path).
include:
  - path: ../your-laravel-project/docker-compose.yml

services:
  # Named "open-docx" (not "app") to avoid colliding with the Laravel
  # backend's own "app" (php-fpm) service now that both are one project.
  open-docx:
    build: .
    ports:
      - "3000:3000" # Next.js app
      - "1234:1234" # real-time collaboration server
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - collab-data:/app/.data # persists the collab server's local document snapshots

volumes:
  collab-data:
