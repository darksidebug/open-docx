services:
  open-docx:
    build: .
    ports:
      - "3000:3000" # Next.js app
      - "1234:1234" # real-time collaboration server
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - collab-data:/app/.data # persists the collab server's local document snapshots
    extra_hosts:
      # Makes the host.docker.internal DNS name available inside this
      # container. Docker Desktop (Mac/Windows) already provides it for
      # free; plain Docker Engine (Linux) needs this line. Harmless either
      # way. See LARAVEL_API_URL in .env(.example) for how it's used.
      - "host.docker.internal:host-gateway"

volumes:
  collab-data:
