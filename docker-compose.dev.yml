# Local development: hot reload for both the Next.js app (Next's own dev
# server) and the collaboration server (tsx --watch). Your local source is
# bind-mounted into the container, so editing files on the host takes effect
# immediately — no image rebuild needed for code changes.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# (docker-compose.yml, without ".dev", is the production image — a full
# rebuild per change, no bind mounts, runs the compiled build via pm2. Use
# that one to test the actual production build/deployment path instead.)
services:
  open-docx:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000" # Next.js app
      - "1234:1234" # real-time collaboration server
    env_file:
      - .env
    environment:
      # Reliable file-watching across Docker's bind-mount boundary — matters
      # most on Docker Desktop (Mac/Windows), where native filesystem events
      # don't always propagate into the container.
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NEXT_WEBPACK_USEPOLLING=1
      - CHOKIDAR_INTERVAL=200
      - NODE_ENV=development
    volumes:
      - .:/app
      # Anonymous volumes: keep the container's own node_modules (matching
      # its OS/arch) and .next build cache instead of letting the bind-mount
      # above shadow them with the host's — especially important for .next,
      # since a stale one built via `next build` (a different structure than
      # `next dev` maintains) can make the dev server behave oddly or seem to
      # ignore changes.
      - /app/node_modules
      - /app/.next
    extra_hosts:
      - "host.docker.internal:host-gateway"
